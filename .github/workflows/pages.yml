name: Test and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The same npm scripts a contributor runs (package.json), so commands live in one place.
      - name: Unit tests in several time zones
        run: npm run test:tz
      - name: Install Playwright, Chromium, and QR and barcode decoders (test-only)
        run: |
          npm run setup
          npx playwright install --with-deps chromium
      - name: QR codes and barcodes scan back with independent decoders; certificates decode
        run: npm run test:decoders
      - name: Browser tests against the built site
        run: npm run test:e2e

  deploy:
    # Only main is published, and only after every test passed.
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build site (stamp asset URLs with the commit so browsers never mix versions)
        run: node tools/build-site.mjs _site "${GITHUB_SHA:0:12}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
