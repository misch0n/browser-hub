<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <meta name="color-scheme" content="light dark">
  <title>Control Center</title>
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="style.css">
  <script src="js/boot.js"></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div id="app">
    <main id="main">
      <div id="transcript" role="log" aria-live="polite" aria-label="Command output">
        <div id="turns"></div>
      </div>

      <footer id="composer">
        <div id="palette" hidden role="dialog" aria-label="Command palette">
          <input id="palette-input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Search commands, aliases, themes, widgets" aria-label="Search commands">
          <ul id="palette-list" role="listbox"></ul>
        </div>

        <div class="prompt-box">
          <span class="prompt-glyph" aria-hidden="true">&gt;</span>
          <div id="field">
            <div id="ghost" aria-hidden="true"><span id="ghost-typed"></span><span id="ghost-rest"></span></div>
            <input id="prompt" type="text" autofocus autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="Try &quot;t buy flour due:tomorrow&quot; or &quot;help&quot;" aria-label="Command prompt">
          </div>
        </div>

        <div id="statusbar">
          <span id="hint" aria-live="off"></span>
          <span class="status-right">
            <span class="status-engine-wrap" title="Default search engine">engine <span id="status-engine" class="t-accent"></span></span>
            <button id="panel-toggle" type="button" aria-controls="panel" title="Show or hide widgets">widgets</button>
          </span>
        </div>
      </footer>
    </main>

    <aside id="panel" aria-label="Widgets">
      <header class="panel-head">
        <span class="panel-title">Widgets</span>
        <button id="panel-close" type="button" aria-label="Close widgets">×</button>
      </header>
      <div id="widgets"></div>
    </aside>
    <div id="scrim" hidden></div>
  </div>

  <input id="file" type="file" hidden>
</body>
</html>
