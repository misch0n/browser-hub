<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <meta name="color-scheme" content="light dark">
  <title>Control Center</title>
  <link rel="stylesheet" href="style.css">
  <script src="js/util.js" defer></script>
  <script src="js/store.js" defer></script>
  <script src="js/aliases.js" defer></script>
  <script src="js/dispatch.js" defer></script>
  <script src="js/completion.js" defer></script>
  <script src="js/calc.js" defer></script>
  <script src="js/units.js" defer></script>
  <script src="js/tools.js" defer></script>
  <script src="js/ics.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/importer.js" defer></script>
  <script src="js/commands.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <main id="output" aria-live="polite" aria-label="Command output"></main>

  <div id="palette" hidden role="dialog" aria-label="Command palette">
    <input id="palette-input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="find a command">
    <ul id="palette-list"></ul>
  </div>

  <div id="promptline">
    <span id="glyph" aria-hidden="true">&#10095;</span>
    <div id="field">
      <div id="ghost" aria-hidden="true"><span id="ghost-typed"></span><span id="ghost-rest"></span></div>
      <input id="prompt" type="text" autofocus autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Command prompt">
    </div>
  </div>

  <input id="file" type="file" hidden>
</body>
</html>
